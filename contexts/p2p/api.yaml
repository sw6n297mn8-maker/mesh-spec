openapi: 3.0.3

info:
  title: Procure-to-Pay sync surface
  version: 0.1.0
  description: >
    Superfície síncrona do BC Procure-to-Pay.
    Source canônica de identidade: contexts/p2p/canvas.cue.
    Commands → POST RPC; Queries → GET. Não usa REST resource-oriented.

    RECORTE (adr-178 + WI-156 + fatia do fecho, missão M1/adr-193): a fila
    de requisições (qry-pending-requisitions da prj-pending-requisitions —
    a fila de triagem/aprovação que o comprador e o gestor vivem), o
    primeiro COMMAND de origem humana: submit-purchase-requisition (o
    engenheiro declara a demanda direto do canteiro — passos 1-3 da
    ds-buyer-procurement-journey; origem net-new per adr-178, migração
    futura em def-081), o COMMAND da triagem: triage-requisition (o ato
    formal do comprador sobre a fila — passo 3 da jornada, fatia WI-156),
    o COMMAND da aprovação: approve-purchase (o portão DUPLO adr-174
    cobertura bdg + adr-177 procedência ssc — o de-acordo do gestor
    pré-pedido) e o COMMAND da emissão: emit-purchase-order (o desfecho do
    recorte — pedido sob authority validada; a fatia da superfície do PO
    abriu com o fecho da jornada). Deferido: os commands de cancelamento
    (requisição e PO) e as queries do PO (qry-active-purchase-orders,
    qry-purchase-order-by-id) — cada um com fatia própria.

    A submissão NÃO tem guard de domínio na porta POR DESIGN: a completude é
    verificada na TRIAGEM (inv-requisition-completeness — requisição
    incompleta é DEVOLVIDA com outcome=returned, permanecendo submitted),
    espelhando o setor de compras real. Por isso o POST não expõe 409/422:
    payload bem-formado entra na fila; o julgamento é do comprador.

    O enum de status reflete o lifecycle materializado do
    agg-purchase-requisition (#PurchaseRequisitionState em
    contexts/p2p/schemas/events.cue).

    security e servers ausentes por design — ver
    architecture/deferred-decisions/def-024.

tags:
  - name: mesh
    description: bc=p2p

paths:
  /v1/p2p/queries/pending-requisitions:
    get:
      operationId: queryPendingRequisitions
      summary: Listar as requisições da fila (por estado, com filtros)
      description: >
        Implementa a query capability qry-pending-requisitions da
        prj-pending-requisitions (domain-model P2P, WI-151): requisições por
        estado — submitted aguardando triagem; triaged aguardando decisão do
        gestor; approved aguardando conversão; terminais para leitura
        histórica. Consumers: comprador (fila de triagem), gestor (fila de
        aprovação), gate de emissão (lookup intra-BC) e a tela do início da
        jornada (adr-178). Leitura pura sem side-effects (read model do event
        log). Envelope {items} desde o v1; paginação/metadados entram
        aditivamente como campos irmãos — NENHUM no v1. Fila vazia devolve
        items vazio (200), não 404. Filtros opcionais espelham os declarados
        pela query capability (status, costCenterRef, categoryRef,
        requestedBy).
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PurchaseRequisitionState'
        - name: costCenterRef
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: categoryRef
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: requestedBy
          in: query
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Fila de requisições (possivelmente vazia)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingRequisitionsView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/p2p/commands/submit-purchase-requisition:
    post:
      operationId: submitPurchaseRequisition
      summary: Submeter requisição de compra — a demanda declarada do canteiro
      description: >
        Materializa cmd-submit-purchase-requisition (WI-151/adr-174): o
        requisitante declara a demanda técnica; o agg-purchase-requisition
        nasce em state=submitted e entra na fila de triagem
        (prj-pending-requisitions). Async no domínio (nenhuma decisão
        síncrona no ato) — o 200 devolve O EVENTO emitido
        (PurchaseRequisitionSubmitted) como confirmação estruturada, molde
        CMT/FCE. ORIGEM NET-NEW (adr-178): a informação nasce da observação
        humana do cronograma físico no canteiro — não existe no sistema até
        este ato; o form da tela é pré-preenchível por shape (Generative
        Form, adr-150) e a origem migra para pré-preenchimento por agente
        quando o cronograma virar input de sistema (def-081). POSTURA
        (def-024): requestedBy é atribuição nominal NÃO-verificada nesta
        borda até o ADR de auth; security ausente por design.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitPurchaseRequisitionRequest'
      responses:
        '200':
          description: Requisição submetida — o evento emitido como confirmação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequisitionSubmitted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/p2p/commands/triage-requisition:
    post:
      operationId: triageRequisition
      summary: Triar requisição — o ato formal do comprador sobre a fila
      description: >
        Materializa cmd-triage-requisition (WI-151/adr-174; superfície nesta
        fatia WI-156): triagem é ATO FORMAL com outcome, não anotação —
        routed-to-sourcing transiciona submitted→triaged sob o guard
        inv-requisition-completeness (requisição completa segue para
        cotação); returned NÃO transiciona — a requisição permanece
        submitted para correção e o evento registra o que falta; rejected
        transiciona submitted→rejected (demanda morta na triagem).
        Outcome-split via selectors per adr-160; um ÚNICO evento para os
        três outcomes — o 200 devolve PurchaseRequisitionTriaged como
        confirmação estruturada, molde CMT/FCE. Alcançável só de submitted
        (molde FCE: 409 para qualquer outro estado; 404 para requisição
        inexistente; 422 quando o julgamento não se sustenta — narrative
        ausente em returned/rejected, ou routed-to-sourcing bloqueado pelo
        guard de completude). POSTURA (def-024): triagedBy é atribuição
        nominal NÃO-verificada nesta borda até o ADR de auth; security
        ausente por design.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriageRequisitionRequest'
      responses:
        '200':
          description: Requisição triada — o evento emitido como confirmação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequisitionTriaged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/p2p/commands/approve-purchase:
    post:
      operationId: approvePurchase
      summary: Aprovar compra — o portão duplo do gestor sobre a requisição triada
      description: >
        Materializa cmd-approve-purchase (adr-174 + adr-177): decisão do
        gestor por Alçada sobre requisição triada, decision approve|reject.
        PRÉ-CONDIÇÕES do approve (portão DUPLO, guards terminais da
        transição triaged→approved): (1) reserva de cobertura CONFIRMADA
        pelo Gate de Cobertura do bdg — Saldo Disponível suficiente +
        Alçada satisfeita (inv-approval-requires-coverage-reservation);
        (2) procedência de preço VERIFICADA contra a cotação vencedora do
        ssc via sourcingDecisionRef — unitPrice × quantity == amount +
        currency match (inv-approval-amount-matches-winning-quotation).
        coverageReservationRef NÃO é entrada do cliente: é preenchida pela
        interação sync com o bdg no ato da aprovação (campo do command
        populado handler-side; viaja no evento). Falha de QUALQUER braço:
        422, requisição permanece triaged (escalada supervisionada), nenhum
        evento emitido. Outcome-split approve/reject via selectors per
        adr-160 — o 200 devolve O EVENTO emitido (oneOf: PurchaseApproved |
        PurchaseApprovalRejected), molde CMT/FCE. Alcançável só de triaged
        (molde FCE: 409 para qualquer outro estado; 404 para requisição
        inexistente; 422 também quando narrative ausente em reject).
        POSTURA (def-024): decidedBy é atribuição nominal NÃO-verificada
        nesta borda até o ADR de auth; security ausente por design.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovePurchaseRequest'
      responses:
        '200':
          description: Decisão registrada — o evento emitido como confirmação
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PurchaseApproved'
                  - $ref: '#/components/schemas/PurchaseApprovalRejected'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/p2p/commands/emit-purchase-order:
    post:
      operationId: emitPurchaseOrder
      summary: Emitir pedido de compra — o desfecho sob authority validada
      description: >
        Materializa cmd-emit-purchase-order: cria o agg-purchase-order em
        initialState=requested ('emit attempt recorded', Patch 1 founder) e
        TENTA a transição requested→emitted sob o gate duplo da emissão —
        inv-purchase-order-requires-valid-authority (claimedAuthorityRef
        resolve decisão SSC vigente com supplier compatível; validação via
        prj-active-purchase-authorities + fallback sync
        QuerySourcingDecision) e inv-emission-requires-approved-requisition
        (requisitionRef DEVE apontar requisição em estado approved, lookup
        intra-BC via prj-pending-requisitions; o emit NÃO re-verifica o
        bdg). Sucesso: 200 devolve evt-purchase-order-emitted (published —
        o sinal que o CMT consome; fora deste recorte). Falha de validação:
        422, e o aggregate PERSISTE em requested como audit trail de
        attempt (pode ser cancelado por fatia futura ou retentado com
        authorityRef diferente em novo aggregate). Após o emit,
        pol-purchase-order-converts-requisition converte a requisição
        (approved→converted) — visível na fila. POSTURA (def-024):
        requestedBy/emittedBy são atribuições nominais NÃO-verificadas
        nesta borda até o ADR de auth; security ausente por design.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmitPurchaseOrderRequest'
      responses:
        '200':
          description: Pedido emitido — o evento emitido como confirmação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderEmitted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Chave única gerada pelo cliente (UUID v4 recomendado) usada pelo
        servidor para cachear resultado dentro de uma janela curta e detectar
        retry — request repetido com mesma key retorna mesmo resultado sem
        executar de novo. Padrão informal de mercado (RFC draft); janela
        exata definida quando ADR de stack chegar.
      schema:
        type: string
        minLength: 1

  responses:
    BadRequest:
      description: Request malformado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Erro interno
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Requisição inexistente
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Estado não permite a operação (triagem alcançável só de submitted)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Payload bem-formado, mas o julgamento não se sustenta no domínio
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: >
        RFC 7807 Problem Details. Cross-BC shared contract; NÃO customizar
        por BC. additionalProperties=true porque RFC 7807 §3.2 permite
        extensões por problem type — mas extensões só por coordenação
        cross-BC (tension-entry), nunca fork local.
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri
        traceId:
          type: string
          description: Correlation id para auditoria

    # ── Value-objects do P2P (mirror de schemas/events.cue) ──
    RequisitionId:
      x-mesh-cue-ref: 'contexts/p2p/schemas/events.cue#RequisitionId'
      type: string
      minLength: 1
    CategoryRef:
      x-mesh-cue-ref: 'contexts/p2p/schemas/events.cue#CategoryRef'
      type: string
      minLength: 1
      description: taxonomia de compra configurada externamente
    CostCenterRef:
      x-mesh-cue-ref: 'contexts/p2p/schemas/events.cue#CostCenterRef'
      type: string
      minLength: 1
      description: owned by bdg (agg-cost-center)
    BudgetStageRef:
      x-mesh-cue-ref: 'contexts/p2p/schemas/events.cue#BudgetStageRef'
      type: string
      minLength: 1
      description: >
        Etapa do cronograma/orçamento que origina a demanda — fato-de-origem
        como campo (WI-151); a fonte real da informação é o cronograma físico
        observado no canteiro (origem net-new, adr-178/def-081).
    SourcingDecisionRef:
      x-mesh-cue-ref: 'contexts/p2p/schemas/events.cue#SourcingDecisionRef'
      type: string
      minLength: 1
      description: owned by ssc — o elo requisição↔cotação (adr-177)
    PurchaseOrderId:
      x-mesh-cue-ref: 'contexts/p2p/schemas/events.cue#PurchaseOrderId'
      type: string
      minLength: 1
    SupplierRef:
      x-mesh-cue-ref: 'contexts/p2p/schemas/events.cue#SupplierRef'
      type: string
      minLength: 1
      description: owned by npm — p2p consome ref sem revalidar (inv-no-supplier-revalidation-by-p2p)
    AuthorityRef:
      x-mesh-cue-ref: 'contexts/p2p/schemas/events.cue#AuthorityRef'
      type: string
      minLength: 1
      description: sourcingDecisionId SSC-mantido — p2p aplica authority, não emite
    AuthorityType:
      x-mesh-cue-ref: 'contexts/p2p/schemas/events.cue#AuthorityType'
      type: string
      enum: [one-shot-decision, preferred-designation, strategic-award]
      description: >
        Discriminator do binding regime (vo-authority-type) — FECHADO com
        fidelidade: o VO fecha via constraint.
    Money:
      x-mesh-cue-ref: 'architecture/shared-schemas/money.cue#Money'
      type: object
      description: >
        #Money consolidado (shared-schemas, def-025) — amount decimal-string
        (Ion-4; escala não normalizada por design), currency ISO 4217.
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    PurchaseRequisitionState:
      x-mesh-cue-ref: 'contexts/p2p/schemas/events.cue#PurchaseRequisitionState'
      type: string
      enum: [submitted, triaged, approved, converted, rejected, cancelled]
      description: >
        Estado canônico da PurchaseRequisition no lifecycle materializado do
        agg-purchase-requisition (adr-174). Espelha #PurchaseRequisitionState
        (disjunção fechada).
    PurchaseScope:
      x-mesh-cue-ref: 'contexts/p2p/schemas/events.cue#PurchaseScope'
      type: object
      description: >
        Escopo da demanda (vo-purchase-scope): descrição, volume estimado,
        prazo, location. estimatedVolume é ESTIMATIVA — nunca base de
        reconciliação de valor (adr-177 usa quantity firme da aprovação).
      required: [description, estimatedVolume, deadline, location]
      properties:
        description:
          type: string
          minLength: 1
        estimatedVolume:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        deadline:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
        location:
          type: string
          minLength: 1
    CancellationReason:
      x-mesh-cue-ref: 'contexts/p2p/schemas/events.cue#CancellationReason'
      type: object
      required: [reasonCode, narrative]
      properties:
        reasonCode:
          type: string
          enum: [demand-cancelled, scope-mismatch, supplier-withdrawal, failed-validation-cleanup, admin-override, queue-overflow, other]
          description: fechado com fidelidade — o domain-model fecha via constraint do vo-cancellation-reason
        narrative:
          type: string
          minLength: 1

    # ── Projection response (qry-pending-requisitions, WI-151) ──
    PendingRequisitionItem:
      type: object
      description: >
        Uma requisição na fila — projeção do event log espelhando os campos
        do agg-purchase-requisition. Campos condicionais por estado:
        triageOutcome após a primeira triagem; coverageReservationRef +
        sourcingDecisionRef + quantity quando approved (os dois braços do
        portão, adr-174/adr-177); purchaseOrderRef quando converted;
        cancellationReason quando cancelled.
      required: [requisitionId, status, requestedBy, costCenterRef, budgetStageRef, categoryRef, scope, submittedAt]
      properties:
        requisitionId:
          $ref: '#/components/schemas/RequisitionId'
        status:
          $ref: '#/components/schemas/PurchaseRequisitionState'
        requestedBy:
          type: string
          minLength: 1
        costCenterRef:
          $ref: '#/components/schemas/CostCenterRef'
        budgetStageRef:
          $ref: '#/components/schemas/BudgetStageRef'
        categoryRef:
          $ref: '#/components/schemas/CategoryRef'
        scope:
          $ref: '#/components/schemas/PurchaseScope'
        triageOutcome:
          type: string
          description: >
            routed-to-sourcing | returned | rejected — ABERTO no espelho
            porque o domain-model não fecha o campo (nota P14 no
            schemas/events.cue).
        coverageReservationRef:
          type: string
          minLength: 1
          description: presente quando approved — reserva do Gate de Cobertura (bdg, adr-174)
        sourcingDecisionRef:
          $ref: '#/components/schemas/SourcingDecisionRef'
        quantity:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
          description: quantidade firme aprovada (adr-177)
        purchaseOrderRef:
          $ref: '#/components/schemas/PurchaseOrderId'
        submittedAt:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
        triagedAt:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
        decidedAt:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
        convertedAt:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
        cancelledAt:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
        cancellationReason:
          $ref: '#/components/schemas/CancellationReason'
    PendingRequisitionsView:
      type: object
      description: >
        Read model da qry-pending-requisitions. Envelope de objeto desde o
        v1: paginação/filtros/metadados entram ADITIVAMENTE como campos
        irmãos de items em versões futuras — nenhum no v1.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PendingRequisitionItem'

    # ── Command request (cmd-submit-purchase-requisition, WI-151) ──
    SubmitPurchaseRequisitionRequest:
      x-mesh-cue-ref: 'contexts/p2p/domain-model.cue#commands.cmd-submit-purchase-requisition'
      type: object
      required: [requestedBy, costCenterRef, budgetStageRef, categoryRef, scope, submittedAt]
      properties:
        requestedBy:
          type: string
          minLength: 1
          description: >
            Requisitante (term-requisitante) — atribuição nominal
            NÃO-verificada nesta borda até o ADR de auth (def-024).
        costCenterRef:
          $ref: '#/components/schemas/CostCenterRef'
        budgetStageRef:
          $ref: '#/components/schemas/BudgetStageRef'
        categoryRef:
          $ref: '#/components/schemas/CategoryRef'
        scope:
          $ref: '#/components/schemas/PurchaseScope'
        submittedAt:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'

    # ── Command request (cmd-triage-requisition, WI-151; superfície WI-156) ──
    TriageRequisitionRequest:
      x-mesh-cue-ref: 'contexts/p2p/domain-model.cue#commands.cmd-triage-requisition'
      type: object
      required: [requisitionId, outcome, triagedBy]
      properties:
        requisitionId:
          $ref: '#/components/schemas/RequisitionId'
        outcome:
          type: string
          description: >
            routed-to-sourcing | returned | rejected — ABERTO no espelho
            porque o domain-model não fecha o campo (nota P14 em
            schemas/events.cue); o handler valida o domínio.
        triagedBy:
          type: string
          minLength: 1
          description: >
            Comprador (term-comprador) — atribuição nominal NÃO-verificada
            nesta borda até o ADR de auth (def-024).
        narrative:
          type: string
          description: >
            Justificativa — obrigatória quando returned ou rejected
            (invariante de handler, não shape; ausência gera 422).

    # ── Event envelope (200 do submit; molde CMT/FCE: devolve o evento emitido) ──
    PurchaseRequisitionSubmitted:
      x-mesh-cue-ref: 'contexts/p2p/schemas/events.cue#PurchaseRequisitionSubmitted'
