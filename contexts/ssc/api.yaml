        construção; nenhum invariante força cobertura total).
      required: [itemId, unitPrice]
      properties:
        itemId:
          type: string
          minLength: 1
        unitPrice:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        declaredCapacity:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
          description: Opcional — capacidade declarada para esta linha.
        deliveryDate:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
          description: Opcional — entrega prometida para esta linha.
    ItemAward:
      x-mesh-cue-ref: 'contexts/ssc/schemas/events.cue#ItemAward'
      type: object
      description: >
        A adjudicação de UMA linha (vo-item-award, adr-198). outcome
        ABERTO no espelho — awarded | no-quotation | withheld são
        INDICATIVOS no domain-model (o glossário do ssc os sela na fatia
        de naming; P14: o espelho não fecha o que o domínio não fecha,
