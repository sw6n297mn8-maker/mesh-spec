        contractTermDuration:
          type: string
          minLength: 1
        indicativeConditions:
          type: string
          minLength: 1

    # ── Projection response (qry-active-sourcing-decisions) ──
    ActiveSourcingDecisionItem:
      type: object
      description: >
        Uma decisão vigente — shape SINTÉTICO do read model (item único para
        os 3 tipos; precedente PendingRequisitionItem/p2p): condicionais por
        tipo (validityPeriod quando preferred-designation;
        expectedContractScope quando strategic-award); selectedSuppliers é o
        nome unificado da query capability (mapeia selected/preferred/
        awardedSuppliers do evento de origem); decidedAt mapeia
        decidedAt/designatedAt/awardedAt.
      required: [sourcingDecisionId, rfqId, categoryRef, decisionType, selectedSuppliers, allocationPolicy, decidedAt]
      properties:
        sourcingDecisionId:
          $ref: '#/components/schemas/SourcingDecisionId'
        rfqId:
          $ref: '#/components/schemas/RFQId'
        categoryRef:
          $ref: '#/components/schemas/CategoryRef'
        decisionType:
          $ref: '#/components/schemas/DecisionType'
        selectedSuppliers:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SupplierRef'
        allocationPolicy:
          $ref: '#/components/schemas/AllocationPolicy'
        validityPeriod:
          $ref: '#/components/schemas/ValidityPeriod'
        expectedContractScope:
          $ref: '#/components/schemas/ExpectedContractScope'
        decidedAt:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
    ActiveSourcingDecisionsView:
      type: object
      description: >
        Read model da qry-active-sourcing-decisions. Envelope de objeto
        desde o v1: paginação/metadados entram ADITIVAMENTE como campos
        irmãos de items em versões futuras — nenhum no v1.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActiveSourcingDecisionItem'

    # ── Espelhos da decisão (schemas/events.cue; consumidos pelo mapa) ──
    EvaluatedSupplier:
      x-mesh-cue-ref: 'contexts/ssc/schemas/events.cue#EvaluatedSupplier'
      type: object
      description: >
        Avaliação per-supplier POR LINHA (vo-evaluated-supplier, adr-198)
        — itemId nomeia o item disputado; o score é por linha, não pela
        cotação inteira. scoresPerCriterion é mapa critério→score ABERTO
        no espelho (ScoresByCriterion sem shape fechado no domain-model —
        P14); notes pode ser vazia.
      required: [itemId, supplierRef, scoresPerCriterion, finalRank, notes]
      properties:
        itemId:
          type: string
          minLength: 1
        supplierRef:
          $ref: '#/components/schemas/SupplierRef'
        scoresPerCriterion:
          type: object
          additionalProperties:
            type: string
            pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        finalRank:
          type: integer
        notes:
          type: string
    Tradeoff:
      x-mesh-cue-ref: 'contexts/ssc/schemas/events.cue#Tradeoff'
      type: object
      description: >
        Justificativa estruturada de escolha vs alternativa (vo-tradeoff) —
        diferenças quantitativas articuladas, não opinião qualitativa.
      required: [preferredSupplier, alternativeSupplier, criterion, rationale]
      properties:
        preferredSupplier:
          $ref: '#/components/schemas/SupplierRef'
        alternativeSupplier:
          $ref: '#/components/schemas/SupplierRef'
