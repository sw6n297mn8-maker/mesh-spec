    # ── Event envelope (200 do open-rfq; molde CMT/FCE/p2p) ──
    RFQOpened:
      x-mesh-cue-ref: 'contexts/ssc/schemas/events.cue#RFQOpened'
      type: object
      required: [id, source, type, envelopeVersion, time, data]
      properties:
        id:
          type: string
          minLength: 1
        source:
          type: string
          const: mesh://contexts/ssc
        type:
          type: string
          const: mesh.ssc.rfq-opened.v1
        envelopeVersion:
          type: string
          const: mesh-1
        time:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
        dataschema:
          type: string
          const: contexts/ssc/schemas/events.cue#RFQOpened
