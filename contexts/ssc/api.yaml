      required: [criteria, weights, evaluatedSuppliers, tradeoffs]
      properties:
        criteria:
          type: array
          items:
            type: string
        weights:
          type: object
          additionalProperties:
            type: string
            pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        evaluatedSuppliers:
          type: array
          items:
            $ref: '#/components/schemas/EvaluatedSupplier'
        tradeoffs:
          type: array
          items:
            $ref: '#/components/schemas/Tradeoff'

    # ── Command request (cmd-submit-quotation; fatia do fecho, M1) ──
    SubmitQuotationRequest:
      x-mesh-cue-ref: 'contexts/ssc/domain-model.cue#commands.cmd-submit-quotation'
      type: object
      description: >
        Espelho dos campos do command na superfície desta fatia —
        paymentTerms/deliverySchedule (opcionais, WI-161) entram com a
        fatia da negociação. Per adr-198 a proposta é POR LINHA: lines
        carrega o preço de cada item cotado (unitPrice/declaredCapacity
        singulares migraram); subconjunto dos itens do escopo = proposta
        PARCIAL, legítima. currency permanece da cotação (uma por
        cotação).
      required: [rfqId, supplierRef, lines, currency, termsNotes]
      properties:
        rfqId:
          $ref: '#/components/schemas/RFQId'
        supplierRef:
          $ref: '#/components/schemas/SupplierRef'
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/QuotationLine'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        termsNotes:
          type: string
          description: pode ser vazia (espelho de events.cue)

    # ── Command request (cmd-propose-counter-terms; fatia da negociação, M7) ──
    ProposeCounterTermsRequest:
      x-mesh-cue-ref: 'contexts/ssc/domain-model.cue#commands.cmd-propose-counter-terms'
      type: object
      description: >
        Espelho dos campos do command — counterTerms exige ≥1 eixo
        preenchido (invariante de handler; 422).
      required: [rfqId, quotationId, counterTerms, proposedBy]
      properties:
        rfqId:
