    # ── Espelho da decisão (schemas/events.cue#DecisionRationale) ──
    DecisionRationale:
      x-mesh-cue-ref: 'contexts/ssc/schemas/events.cue#DecisionRationale'
      type: object
      description: >
        Rationale estruturado da decisão (vo-decision-rationale) — produzido
        por svc-fitness-rule-evaluator, nunca julgamento manual. weights é
