        quotationId:
          $ref: '#/components/schemas/QuotationId'
        counterTerms:
          $ref: '#/components/schemas/CounterTerms'
        proposedBy:
          type: string
          minLength: 1
          description: >
            Comprador — atribuição nominal NÃO-verificada nesta borda até
            o ADR de auth (def-024).

    # ── Command request (cmd-revise-quotation; fatia da negociação, M7) ──
    ReviseQuotationRequest:
      x-mesh-cue-ref: 'contexts/ssc/domain-model.cue#commands.cmd-revise-quotation'
      type: object
      description: >
        Espelho dos campos do command — restatement das condições
        comerciais: lines obrigatório (preço POR LINHA, adr-198 —
        restatement completo da cobertura vigente); paymentTerms/
        deliverySchedule/termsNotes opcionais (ausente = mantém vigente).
        CURRENCY IMUTÁVEL por construção — o command não a carrega
        (invariante de handler).
      required: [rfqId, quotationId, supplierRef, lines, revisionNote]
      properties:
        rfqId:
          $ref: '#/components/schemas/RFQId'
        quotationId:
          $ref: '#/components/schemas/QuotationId'
        supplierRef:
          allOf:
            - $ref: '#/components/schemas/SupplierRef'
          description: >
            Supplier que revisa — deve match o da cotação original
            (invariante de handler; 422). Atribuição nominal
            NÃO-verificada até o ADR de auth (def-024).
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/QuotationLine'
          description: >
            Linhas revisadas (adr-198) — restatement completo da
            cobertura vigente.
        paymentTerms:
          allOf:
            - $ref: '#/components/schemas/PaymentTerms'
          description: Opcional — ausente mantém as condições vigentes.
        deliverySchedule:
          allOf:
            - $ref: '#/components/schemas/DeliverySchedule'
          description: Opcional — ausente mantém a programação vigente.
        termsNotes:
          type: string
          description: >
            Opcional — prosa complementar revisada; ausente mantém a
            vigente.
        revisionNote:
          type: string
          description: >
            O que mudou e por quê — audit da rodada (espelho de
            events.cue; pode ser vazia por shape).

