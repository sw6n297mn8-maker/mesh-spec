        targetUnitPrice:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        requestedPaymentTerms:
          $ref: '#/components/schemas/PaymentTerms'
        requestedDeliverySchedule:
          $ref: '#/components/schemas/DeliverySchedule'
        message:
          type: string
    DecisionType:
      x-mesh-cue-ref: 'contexts/ssc/schemas/events.cue#DecisionType'
      type: string
      enum: [one-shot, preferred-designation, strategic-award]
      description: >
        Tipo declarado upfront (vo-decision-type) — FECHADO com fidelidade:
        o domain-model fecha via constraint.
    RFQItem:
      x-mesh-cue-ref: 'contexts/ssc/schemas/events.cue#RfqItem'
      type: object
      description: >
        Um item do escopo (vo-rfq-item, adr-198) — a LINHA da matriz item
        × fornecedor. itemId é identidade LOCAL à RFQ (endereçamento
        cross-BC pelo par rfqId+itemId). unit é string DECLARADA;
        canonização/normalização de unidade deferida em def-093. quantity
        é ESTIMATIVA do escopo — nunca base de reconciliação (a quantity
        FIRME vive na linha de aprovação do p2p).
      required: [itemId, description, quantity, unit]
      properties:
        itemId:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        quantity:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        unit:
          type: string
          minLength: 1
        neededBy:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
          description: Opcional — data de necessidade da linha.
    QuotationLine:
      x-mesh-cue-ref: 'contexts/ssc/schemas/events.cue#QuotationLine'
      type: object
      description: >
        Linha de uma cotação (vo-quotation-line, adr-198) — o preço do
