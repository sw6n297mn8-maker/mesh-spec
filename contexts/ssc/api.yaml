      required: [itemId, outcome]
      properties:
        itemId:
          type: string
          minLength: 1
        outcome:
          type: string
          minLength: 1
        awardedSupplierRef:
          $ref: '#/components/schemas/SupplierRef'
        awardedQuotationRef:
          $ref: '#/components/schemas/QuotationId'
        narrative:
          type: string
    RFQScope:
      x-mesh-cue-ref: 'contexts/ssc/schemas/events.cue#RfqScope'
      type: object
      description: >
        Escopo da RFQ ITEMIZADO (vo-rfq-scope, adr-198): categoria, prazo
        e location no nível do escopo; o CONTEÚDO é a lista de itens
        (description/estimatedVolume singulares migraram para eles).
      required: [categoryRef, items, deadline, location]
      properties:
        categoryRef:
          $ref: '#/components/schemas/CategoryRef'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RFQItem'
        deadline:
          type: string
