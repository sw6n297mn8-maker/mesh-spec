          type: string
          minLength: 1
        rationale:
          type: string
          minLength: 1
    FitnessRuleSnapshot:
      x-mesh-cue-ref: 'contexts/ssc/schemas/events.cue#FitnessRuleSnapshot'
      type: object
      description: >
        Snapshot imutável de fitness rules (vo-fitness-rule-snapshot).
        content ABERTO no espelho — FitnessRuleContent tem shape
        deliberadamente em oq-ssc-8; o espelho não inventa (P14).
      required: [versionId, content, appliedAt]
      properties:
        versionId:
          type: string
          minLength: 1
        content:
          type: object
          additionalProperties: true
        appliedAt:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'

    # ── Projection response (qry-quotation-map) ──
    QuotationMapItem:
      type: object
      description: >
        O CABEÇALHO de uma cotação no mapa — shape SINTÉTICO do read
        model (precedente ActiveSourcingDecisionItem). Per adr-198 o
        PREÇO não mora aqui: ele é por linha e vive nas células
        (QuotationMapCell) das linhas do escopo. Aqui ficam os campos da
        cotação INTEIRA: identidade, fornecedor, currency, status do
        lifecycle da ent-quotation (submitted → withdrawn, enum FECHADO
        com fidelidade) e, com a negociação (WI-161, prosa canônica de
        prj-quotation-map/qry-quotation-map), as RODADAS por cotação:
        revisionNumber, condições estruturadas comparáveis
        (paymentTerms/deliverySchedule — vigentes, da submissão ou da
        última revisão) e o estado da rodada (counterTermsState +
        pendingCounterTerms; pendingCounterTerms.itemId nomeia a linha
        quando a rodada é de linha). termsNotes pode ser vazia (espelho
        de events.cue).
      required: [quotationId, supplierRef, revisionNumber, counterTermsState, currency, termsNotes, status, submittedAt]
      properties:
        quotationId:
          allOf:
            - $ref: '#/components/schemas/QuotationId'
          description: >
            Identidade da cotação no mapa — Phase 0: 1 fornecedor → 1
            cotação por RFQ (rfqId + supplierRef também identificam;
            quotationId é a identidade canônica que as rodadas e o gate
            de procedência referenciam).
        supplierRef:
          $ref: '#/components/schemas/SupplierRef'
        revisionNumber:
          type: integer
          description: >
            Contador de revisões da cotação (0 na submissão original;
            incrementa a cada revisão — rodadas contáveis no event log).
        counterTermsState:
          type: string
          enum: [none, pending, revised, declined]
          description: >
            Estado da rodada de negociação, DERIVADO dos 3 events de
            negociação (mapeamento da prosa 'contraproposta
            aberta/respondida/declinada' de prj-quotation-map): none =
            sem rodada; pending = contraproposta ABERTA aguardando
            resposta (evt-counter-terms-proposed sem desfecho); revised =
            RESPONDIDA com revisão (evt-quotation-revised); declined =
            RESPONDIDA com manutenção (evt-counter-terms-declined).
        pendingCounterTerms:
          allOf:
            - $ref: '#/components/schemas/CounterTerms'
          description: >
            O conteúdo da contraproposta aguardando resposta — presente
            apenas quando counterTermsState=pending ('qual alvo foi
            pedido', prosa do evt-counter-terms-proposed).
        paymentTerms:
          allOf:
            - $ref: '#/components/schemas/PaymentTerms'
          description: >
            Opcional — condições de pagamento estruturadas VIGENTES (da
            submissão ou da última revisão; WI-161).
        deliverySchedule:
          allOf:
            - $ref: '#/components/schemas/DeliverySchedule'
          description: >
            Opcional — volume com entregas programadas VIGENTE (WI-161).
        currency:
          type: string
          minLength: 1
        termsNotes:
          type: string
        status:
          type: string
          enum: [submitted, withdrawn]
        submittedAt:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
    QuotationMapCell:
      type: object
      description: >
        Uma CÉLULA da matriz item × fornecedor (adr-198): o que este
        fornecedor ofereceu para ESTA linha. Ausência de célula para um
        fornecedor na linha = item não cotado por ele (proposta parcial —
        a célula vazia é a ausência, não um registro com zeros).
        unitPrice é o VIGENTE (da submissão ou da última revisão — a casa
        canônica do preço, inv-negotiated-terms-materialize-on-quotation);
        initialUnitPrice é o da submissão original, e o par exibe a
        economia da negociação POR LINHA. equalizedScore é DERIVADO
        deterministicamente (fitness rules aplicadas sobre a linha —
        ausente quando a derivação não produziu score; nunca input
        manual).
      required: [quotationId, supplierRef, unitPrice, initialUnitPrice]
      properties:
        quotationId:
          $ref: '#/components/schemas/QuotationId'
        supplierRef:
          $ref: '#/components/schemas/SupplierRef'
        unitPrice:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        initialUnitPrice:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        declaredCapacity:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        deliveryDate:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
        equalizedScore:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
    QuotationMapRow:
      type: object
      description: >
        Uma LINHA da matriz (adr-198): o item do escopo + as células dos
        fornecedores que o cotaram + o award quando a janela concluiu.
        cells pode ser VAZIA — item que nenhum fornecedor cotou existe na
        matriz e é visível; é a linha que o award registra como
        no-quotation. A linha é a unidade que a comparação, a decisão e o
        gate de procedência do p2p percorrem.
      required: [item, cells]
      properties:
        item:
          $ref: '#/components/schemas/RFQItem'
        cells:
          type: array
          items:
            $ref: '#/components/schemas/QuotationMapCell'
        award:
          allOf:
            - $ref: '#/components/schemas/ItemAward'
          description: >
            O carimbo da decisão NESTA linha — presente apenas quando
            windowStatus=concluded.
    QuotationMapDecision:
      type: object
      description: >
        O carimbo da decisão (presente apenas quando
        windowStatus=concluded): a adjudicação POR LINHA (itemAwards,
        adr-198 — repetida em cada QuotationMapRow.award para leitura na
        linha), vencedor(es) derivados, ranking final por linha
        (evaluatedSuppliers com itemId), tradeoffs e o snapshot de
        fitness rules que sustentou a comparação — a reconstituição
        auditável.
      required: [sourcingDecisionId, itemAwards, selectedSuppliers, evaluatedSuppliers, tradeoffs, fitnessRuleSnapshot]
      properties:
        sourcingDecisionId:
          $ref: '#/components/schemas/SourcingDecisionId'
        itemAwards:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemAward'
        selectedSuppliers:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SupplierRef'
        evaluatedSuppliers:
          type: array
          items:
            $ref: '#/components/schemas/EvaluatedSupplier'
        tradeoffs:
          type: array
          items:
            $ref: '#/components/schemas/Tradeoff'
        fitnessRuleSnapshot:
          $ref: '#/components/schemas/FitnessRuleSnapshot'
    QuotationMapView:
      type: object
      description: >
        Read model da qry-quotation-map — a MATRIZ ITEM × FORNECEDOR de
        UMA RFQ (adr-198). items são as LINHAS (item do escopo + células
        dos fornecedores que o cotaram + award pós-decisão); quotations
        são os CABEÇALHOS por fornecedor (o que é da cotação inteira:
        currency, rodadas de negociação, condições estruturadas, status)
        — sem duplicar preço, que vive nas células. categoryRef viaja no
        payload (leitura interpretativa adr-180 dec 4). windowStatus
        espelha o lifecycle FECHADO do agg-sourcing-process;
        comparisonBasis explicita o regime da equalização (indicative =
        fitness rules vigentes durante a janela; decided = snapshot
        carimbado pós-decisão); decision presente apenas quando
        concluded. A matriz é ENTREGUE pela projection, não montada na
        borda: transpor no consumidor recriaria a derivação fora do read
        model (o vício que prj-quotation-map existe para evitar) e não
        teria onde representar a linha que ninguém cotou.
      required: [rfqId, categoryRef, windowStatus, comparisonBasis, items, quotations]
      properties:
        rfqId:
          $ref: '#/components/schemas/RFQId'
        categoryRef:
          $ref: '#/components/schemas/CategoryRef'
        windowStatus:
          type: string
          enum: [open, concluded, cancelled]
        comparisonBasis:
          type: string
          enum: [indicative, decided]
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/QuotationMapRow'
          description: >
            As LINHAS da matriz — uma por item do escopo, na ordem do
            escopo. Cobertura TOTAL: item sem nenhuma cotação aparece com
            cells vazia (adr-198).
        quotations:
          type: array
          items:
            $ref: '#/components/schemas/QuotationMapItem'
          description: >
            Os CABEÇALHOS por fornecedor — campos da cotação inteira; o
            preço por linha vive em items[].cells.
        decision:
          $ref: '#/components/schemas/QuotationMapDecision'

    # ── Command request (cmd-open-rfq) ──
    OpenRfqRequest:
      x-mesh-cue-ref: 'contexts/ssc/domain-model.cue#commands.cmd-open-rfq'
