    AllocationPolicy:
      x-mesh-cue-ref: 'contexts/ssc/schemas/events.cue#AllocationPolicy'
      type: object
      required: [type, splitDetails]
      properties:
        type:
          type: string
          enum: [single, split-by-percentage, split-by-criteria]
        splitDetails:
          type: object
          description: >
            ABERTO no espelho — AllocationSplitDetails não tem shape
