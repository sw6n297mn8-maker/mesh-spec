openapi: 3.0.3

info:
  title: Strategic Sourcing sync surface
  version: 0.1.0
  description: >
    Superfície síncrona do BC Strategic Sourcing.
    Source canônica de identidade: contexts/ssc/canvas.cue.
    Commands → POST RPC; Queries → GET. Não usa REST resource-oriented.

    RECORTE (WI-159 + WI-160 + fatia do fecho M1 + fatia da negociação,
    missão M7/adr-193 — a cotação atravessa a jornada): a abertura de RFQ
    (cmd-open-rfq — o passo 5 da ds-buyer-procurement-journey, onde a
    jornada modelada originalmente começava), a leitura das decisões
    vigentes (qry-active-sourcing-decisions — o comprador vê o que já vige
    na categoria antes de abrir RFQ nova; P2P consome como cache de
    policies; controllers para reporting), o GET do mapa de cotações
    (qry-quotation-map — WI-160/adr-180, a 3ª família do frontend: a
    comparação consolidada que suporta a escolha, passo do mapa da
    jornada; com a negociação, o mapa carrega as RODADAS por cotação), a
    submissão de cotação (cmd-submit-quotation), a NEGOCIAÇÃO (WI-161,
    aberta nesta fatia M7 — o passo 8 da jornada: cmd-propose-counter-
    terms, o pedido do comprador; cmd-revise-quotation, o fornecedor
    materializa as condições negociadas na própria cotação;
    cmd-decline-counter-terms, o fornecedor mantém — os 2 desfechos de
    uma contraproposta, per inv-negotiated-terms-materialize-on-quotation)
    e a decisão one-shot (cmd-make-one-shot-sourcing-decision — a
    conclusão atômica da janela: RFQConcluded + SourcingDecisionMade no
    mesmo ato).
    Deferido: o lookup por id (qry-sourcing-decision); withdraw, os
    demais tipos de conclusão (preferred/strategic) e cancelamento —
    cada um com fatia própria.
    qry-rfq-history-by-category é INTERNO por decisão do domínio (nunca
    entra nesta superfície).

    A abertura é NASCIMENTO-COM-EVENTO (agg-sourcing-process criado em
    initialState=open, mesmo padrão do submit do p2p): não há stream nem
    estado prévio — por isso o POST não expõe 404/409. Expõe 422: o
    julgamento da abertura pode não se sustentar (pool competitivo
    insuficiente sem exceção supervisionada — inv-competitive-pool-or-
    supervised-exception; fornecedor não-qualificado — inv-qualification-
    as-precondition; campos condicionais por decisionType ausentes —
    invariante de handler).

    security e servers ausentes por design — ver
    architecture/deferred-decisions/def-024.

tags:
  - name: mesh
    description: bc=ssc

paths:
  /v1/ssc/queries/active-sourcing-decisions:
    get:
      operationId: queryActiveSourcingDecisions
      summary: Listar decisões de sourcing vigentes (por categoria, opcional)
      description: >
        Implementa a query capability qry-active-sourcing-decisions da
        prj-active-sourcing-decisions: decisões vigentes — one-shot
        pendentes de execução em P2P, preferred designations com validUntil
        futuro, strategic awards aguardando contrato CTR. Leitura pura sem
        side-effects (read model do event log). Envelope {items} desde o
        v1; lista vazia devolve items vazio (200), não 404. Filtro
        categoryRef opcional (sem filtro = todas as vigentes — reporting).
        Shape SINTÉTICO de read model (precedente do PendingRequisitionItem
        do p2p): item único para os 3 tipos com condicionais por tipo;
        selectedSuppliers é o nome unificado da query capability; decidedAt
        mapeia decidedAt/designatedAt/awardedAt do evento de origem.
        decisionRationale e fitnessRuleSnapshot NÃO entram — pertencem ao
        lookup por id (qry-sourcing-decision, payload completo, fatia
        futura).
      parameters:
        - name: categoryRef
          in: query
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Decisões vigentes (possivelmente vazia)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveSourcingDecisionsView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/ssc/queries/quotation-map/{rfqId}:
    get:
      operationId: queryQuotationMap
      summary: Consultar o mapa de cotações de uma RFQ
      description: >
        Implementa a query capability qry-quotation-map da
        prj-quotation-map (WI-152; itemizada em adr-198): a comparação
        consolidada que o comprador usa para escolher — a MATRIZ ITEM ×
        FORNECEDOR, uma linha por item do escopo e uma célula por
        fornecedor que o cotou, com a equalização TCO DERIVADA
        deterministicamente POR LINHA e o carimbo da decisão (award por
        linha) quando ela existe. Item que nenhum fornecedor cotou APARECE
        na matriz, com células vazias. Leitura pura sem side-effects (read
        model do event log). Molde by-id do FCE. LEITURA INTERPRETATIVA
        (adr-180 dec 4) da prosa da capability ('por rfqId, com filtro por
        categoryRef'): o GET é by-rfqId e categoryRef viaja NO PAYLOAD — o
        'filtro por categoria' pertence a uma LISTAGEM de mapas que não
        existe como projection (mesma família da lacuna 'RFQs abertas' do
        WI-159); a listagem não é inventada aqui. Alternativa descartada:
        query param categoryRef opcional no by-id — rfqId já identifica
        unicamente o mapa e sua categoria (validação cruzada seria
        contrato sem função; filtro sem listagem é vazio).
        comparisonBasis explicita o regime da equalização (distinção da
        projection): indicative DURANTE a janela (fitness rules VIGENTES
        da categoria); decided PÓS-decisão (o SNAPSHOT carimbado —
        comparação auditável). decision presente apenas quando
        windowStatus=concluded. CONFIDENCIALIDADE COMPETITIVA: superfície
        de comprador/supervisor/auditoria intra-organização — NUNCA
        superfície de fornecedor (um fornecedor nunca vê a cotação do
        outro; os events de cotação são internal; NTF não propaga o mapa).
        404 quando a RFQ não existe (diferente da fila vazia da listagem:
        aqui o recurso-pai é o mapa de UMA RFQ identificada).
      parameters:
        - name: rfqId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: O mapa de cotações da RFQ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationMapView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/ssc/commands/open-rfq:
    post:
      operationId: openRfq
      summary: Abrir RFQ — o processo competitivo nasce com tipo declarado
      description: >
        Materializa cmd-open-rfq: o category manager abre a RFQ para uma
        categoria com escopo definido e tipo declarado UPFRONT (one-shot /
        preferred-designation / strategic-award — enum FECHADO com
        fidelidade: o vo-decision-type fecha via constraint, o espelho
        fecha junto). Nascimento-com-evento: agg-sourcing-process criado em
        initialState=open; o 200 devolve O EVENTO emitido (RFQOpened, com o
        pool de convidados construído por svc-supplier-pool-builder
        consultando NPM) como confirmação estruturada, molde CMT/FCE/p2p.
        Campos condicionais por tipo (invariante de handler, 422 quando
        violada): validityPeriod exigido para preferred-designation;
        expectedContractScope exigido para strategic-award; ambos proibidos
        fora dos seus tipos. requestedAt é field DECLARADO do command
        (sustenta o audit requestedAt < openedAt de
        inv-decision-type-declared-upfront). POSTURA (def-024): requestedBy
        é atribuição nominal NÃO-verificada nesta borda até o ADR de auth;
        security ausente por design.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenRfqRequest'
      responses:
        '200':
          description: RFQ aberta — o evento emitido como confirmação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RFQOpened'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/ssc/commands/submit-quotation:
    post:
      operationId: submitQuotation
      summary: Submeter cotação — a proposta comercial do fornecedor à RFQ aberta
      description: >
        Materializa cmd-submit-quotation (WI-152): o fornecedor convidado
        registra sua proposta comercial na RFQ aberta — mutação intra-open
        (a ent-quotation nasce nested com status=submitted e
        revisionNumber=0; NÃO é transição de lifecycle). O 200 devolve O
        EVENTO emitido (QuotationSubmitted, internal — fato intra-BC: a
        confidencialidade competitiva veta evento público, não o fato
        existir) como confirmação estruturada, molde CMT/FCE. 404 para RFQ
        inexistente; 409 quando a janela não está open (concluded/
        cancelled); 422 quando o julgamento não se sustenta (fornecedor
        fora do pool convidado; segunda cotação do mesmo fornecedor —
        re-submissão é withdraw + submit, e withdraw é fatia própria).
        paymentTerms/deliverySchedule (campos opcionais do command,
        WI-161) ficam FORA deste request — o evt-quotation-submitted não
        os carrega; condições estruturadas entram pela via da REVISÃO
        (cmd-revise-quotation, superfície da negociação). CONFIDENCIALIDADE:
        um fornecedor jamais vê a cotação do outro — esta borda só
        confirma a própria submissão. POSTURA (def-024): supplierRef é
        atribuição nominal NÃO-verificada nesta borda até o ADR de auth;
        security ausente por design.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitQuotationRequest'
      responses:
        '200':
          description: Cotação submetida — o evento emitido como confirmação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationSubmitted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/ssc/commands/propose-counter-terms:
    post:
      operationId: proposeCounterTerms
      summary: Propor contraproposta — o pedido do comprador sobre uma cotação
      description: >
        Materializa cmd-propose-counter-terms (WI-161): o comprador
        registra contraproposta sobre uma cotação específica durante a
        janela — mutação intra-open que abre uma RODADA de negociação.
        NÃO muta a ent-quotation (inv-negotiated-terms-materialize-on-
        quotation — a regra de ouro: contraproposta é PEDIDO aguardando
        resposta do fornecedor; quem declara condições comerciais é o
        fornecedor, o comprador nunca escreve na cotação). O 200 devolve
        O EVENTO emitido (CounterTermsProposed, internal — mesmo veto de
        confidencialidade dos fatos de cotação: um fornecedor jamais vê a
        negociação do outro) como confirmação estruturada, molde
        CMT/FCE/p2p. Invariantes de handler: RFQ status=open obrigatório
        (409 quando a janela não está open); counterTerms exige ≥1 eixo
        preenchido — contraproposta vazia não é rodada (422); cotação
        deve estar status=submitted — rodada sobre cotação withdrawn não
        se sustenta (422). 404 para RFQ ou cotação inexistente. POSTURA
        (def-024): proposedBy é atribuição nominal NÃO-verificada nesta
        borda até o ADR de auth; security ausente por design.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeCounterTermsRequest'
      responses:
        '200':
          description: Contraproposta registrada — o evento emitido como confirmação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterTermsProposed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/ssc/commands/revise-quotation:
    post:
      operationId: reviseQuotation
      summary: Revisar cotação — o fornecedor materializa as condições negociadas
      description: >
        Materializa cmd-revise-quotation (WI-161): o fornecedor revisa a
        PRÓPRIA cotação durante a janela (mutação intra-open) —
        tipicamente em resposta a contraproposta. É o ÚNICO mecanismo pelo
        qual condições negociadas entram na comparação, na avaliação e na
        decisão (inv-negotiated-terms-materialize-on-quotation): a revisão
        atualiza a ent-quotation in-place preservando quotationId
        (continuidade para decisionRationale.evaluatedSuppliers e para o
        gate de procedência do p2p — adr-177/adr-198 resolvem unitPrice ×
        quantity == lineAmount na LINHA vencedora com o preço FINAL por
        construção), incrementa revisionNumber e carimba lastRevisedAt; o
        histórico de rodadas vive no event log. Restatement: lines
        obrigatório (preço por item, restatement completo da cobertura);
        paymentTerms/deliverySchedule/termsNotes opcionais (ausente =
        mantém vigente). CURRENCY IMUTÁVEL por construção — o request não
        a carrega (invariante de handler). Status da cotação INALTERADO
        (submitted — revisão não é lifecycle). O 200 devolve O EVENTO
        emitido (QuotationRevised, internal) como confirmação
        estruturada. Invariantes de handler: RFQ status=open (409 quando
        a janela não está open); cotação status=submitted (422);
        supplierRef deve match o da cotação original (422). 404 para RFQ
        ou cotação inexistente. POSTURA (def-024): supplierRef é
        atribuição nominal NÃO-verificada nesta borda até o ADR de auth;
        security ausente por design.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviseQuotationRequest'
      responses:
        '200':
          description: Cotação revisada — o evento emitido como confirmação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationRevised'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/ssc/commands/decline-counter-terms:
    post:
      operationId: declineCounterTerms
      summary: Declinar contraproposta — o fornecedor mantém as condições vigentes
      description: >
        Materializa cmd-decline-counter-terms (WI-161): o fornecedor
        declina a contraproposta e mantém as condições vigentes da
        cotação — fecha a rodada SEM revisão (mutação intra-open). Par
        simétrico do revise: os 2 desfechos possíveis de uma
        contraproposta viram fatos — sem o ato de recusa, silêncio e
        manutenção deliberada seriam indistinguíveis na fila do comprador
        ('manteve' vs 'aguardando'). O 200 devolve O EVENTO emitido
        (CounterTermsDeclined, internal) como confirmação estruturada.
        declineNote possivelmente vazia — recusa seca é legítima (a
        obrigação de justificativa é do cancelamento de RFQ, não daqui).
        Invariantes de handler: RFQ status=open (409 quando a janela não
        está open); supplierRef deve match o da cotação (422); cotação
        status=submitted (422). 404 para RFQ ou cotação inexistente.
        POSTURA (def-024): supplierRef é atribuição nominal NÃO-verificada
        nesta borda até o ADR de auth; security ausente por design.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclineCounterTermsRequest'
      responses:
        '200':
          description: Contraproposta declinada — o evento emitido como confirmação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterTermsDeclined'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/ssc/commands/make-one-shot-sourcing-decision:
    post:
      operationId: makeOneShotSourcingDecision
      summary: Concluir a RFQ one-shot — a decisão de sourcing formalizada
      description: >
        Materializa cmd-make-one-shot-sourcing-decision: a conclusão da
        janela E a decisão são o MESMO ato atômico — transição
        open→concluded emitindo RFQConcluded + SourcingDecisionMade no
        mesmo append. Payload mínimo (rfqId + decidedBy): rationale,
        ranking (evaluatedSuppliers) e allocation são produzidos por
        svc-fitness-rule-evaluator (determinístico, fitness rules
        versionadas sobre os sinais estruturados — nunca julgamento
        manual no payload). Guards da transição: decisionType declarado
        upfront deve ser one-shot (inv-decision-type-declared-upfront);
        qualificação re-validada no decision time
        (inv-qualification-as-precondition, via NPM); pool competitivo ≥2
        qualificados com cotação vigente
        (inv-competitive-pool-or-supervised-exception — o caminho da
        exceção supervisionada é fatia própria); rationale completo
        (inv-decision-rationale-required); snapshot versionado
        (inv-fitness-rules-versioned-config); decisão apenas de sinais
        estruturados (inv-decision-from-structured-signals). O 200 devolve
        SourcingDecisionMade (o fato decisório; RFQConcluded é o
        bookkeeping da janela, appended atomicamente no mesmo ato). 404
        para RFQ inexistente; 409 quando a janela não está open; 422
        quando qualquer guard barra. A decisão formaliza as condições
        VIGENTES nas cotações no decision time
        (inv-negotiated-terms-materialize-on-quotation) — sem rodadas de
        negociação, valem as condições da submissão original. POSTURA
        (def-024): decidedBy é atribuição nominal NÃO-verificada nesta
        borda até o ADR de auth; security ausente por design.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MakeOneShotSourcingDecisionRequest'
      responses:
        '200':
          description: Decisão formalizada — o fato decisório como confirmação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcingDecisionMade'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Chave única gerada pelo cliente (UUID v4 recomendado) usada pelo
        servidor para cachear resultado dentro de uma janela curta e detectar
        retry — request repetido com mesma key retorna mesmo resultado sem
        executar de novo. Padrão informal de mercado (RFC draft); janela
        exata definida quando ADR de stack chegar.
      schema:
        type: string
        minLength: 1

  responses:
    BadRequest:
      description: Request malformado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Payload bem-formado, mas o julgamento da abertura não se sustenta no domínio
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: RFQ (ou cotação referenciada) inexistente
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Erro interno
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: >
        RFC 7807 Problem Details. Cross-BC shared contract; NÃO customizar
        por BC. additionalProperties=true porque RFC 7807 §3.2 permite
        extensões por problem type — mas extensões só por coordenação
        cross-BC (tension-entry), nunca fork local.
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri
        traceId:
          type: string
          description: Correlation id para auditoria

    # ── Value-objects do SSC (mirror de schemas/events.cue) ──
    RFQId:
      x-mesh-cue-ref: 'contexts/ssc/schemas/events.cue#RfqId'
      type: string
      minLength: 1
    CategoryRef:
      x-mesh-cue-ref: 'contexts/ssc/schemas/events.cue#CategoryRef'
      type: string
      minLength: 1
      description: taxonomia de compra configurada externamente
    SupplierRef:
      x-mesh-cue-ref: 'contexts/ssc/schemas/events.cue#SupplierRef'
      type: string
      minLength: 1
      description: owned by npm — ssc consome ref, npm mantém identidade
    SourcingDecisionId:
      x-mesh-cue-ref: 'contexts/ssc/schemas/events.cue#SourcingDecisionId'
      type: string
      minLength: 1
    QuotationId:
      x-mesh-cue-ref: 'contexts/ssc/schemas/events.cue#QuotationId'
      type: string
      minLength: 1
      description: >
        vo-quotation-id — root identity de ent-quotation nested; preservada
        através das rodadas de negociação (a continuidade que sustenta o
        gate de procedência do adr-177).
    PaymentTerms:
      x-mesh-cue-ref: 'contexts/ssc/schemas/events.cue#PaymentTerms'
      type: object
      description: >
        Condições de pagamento estruturadas (vo-payment-terms, WI-161) — o
        eixo do fluxo de caixa. termScheduleDays: vencimentos em dias,
        lista NÃO-VAZIA (o domínio a declara — shape fecha junto);
        ESTRITAMENTE CRESCENTE é invariante de handler (não
        shape-expressível). description pode ser vazia.
      required: [termScheduleDays, description]
      properties:
        termScheduleDays:
          type: array
          minItems: 1
          items:
            type: integer
        description:
          type: string
    DeliveryScheduleEntry:
      x-mesh-cue-ref: 'contexts/ssc/schemas/events.cue#DeliveryScheduleEntry'
      type: object
      required: [quantity, dueDate]
      properties:
        quantity:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        dueDate:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
    DeliverySchedule:
      x-mesh-cue-ref: 'contexts/ssc/schemas/events.cue#DeliverySchedule'
      type: object
      description: >
        Volume com entregas programadas (vo-delivery-schedule, WI-161) —
        entries não-vazia quando o VO está presente (o domínio a declara).
        notes pode ser vazia.
      required: [entries, notes]
      properties:
        entries:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DeliveryScheduleEntry'
        notes:
          type: string
    CounterTerms:
      x-mesh-cue-ref: 'contexts/ssc/schemas/events.cue#CounterTerms'
      type: object
      description: >
        Contraproposta do comprador (vo-counter-terms, WI-161) — os 3
        eixos opcionais individualmente; '≥1 eixo preenchido' é invariante
        de handler (o espelho não fecha disjunção que o domínio declara
        como handler-level; violação gera 422). message pode ser vazia.
        Per adr-198, itemId opcional mira a rodada numa LINHA
        (targetUnitPrice de linha); ausente = eixos da cotação inteira
        (paymentTerms/deliverySchedule).
      required: [message]
      properties:
        itemId:
          type: string
          minLength: 1
          description: >
            Opcional (adr-198) — alvo da rodada quando a contraproposta é
