openapi: 3.0.3

info:
  title: Financial Commitment Execution sync surface
  version: 0.1.0
  description: >
    Superfície síncrona do BC Financial Commitment Execution.
    Source canônica de identidade: contexts/fce/canvas.cue.
    Commands → POST RPC; Queries → GET. Não usa REST resource-oriented.

    RECORTE (WI-143 + WI-144 + WI-146): as queries de leitura do Payment —
    estado por id (QueryPaymentSettlementStatus, WI-143) e a fila de
    escalados aguardando decisão humana (QueryEscalatedPayments, WI-144;
    alarme rico FCE-local — o dossiê profundo compõe-se no CLIENTE via as
    queries já existentes do CMT/DLV seguindo o commitmentRef; dossiê
    servidor cross-BC é projeção Phase 1+/NIM, fora deste contrato) — e o
    primeiro COMMAND supervisionado: resolve-guard-escalation (WI-146,
    molde CMT; adr-155), sob a postura do def-024.
    Deferido — oq-fce-1 permanece aberta: (b) os comandos do caminho
    autônomo (materialize/authorize/dispatch/settle) — o canvas declara
    inbound event-driven, sem command surface. O item (c) materializou:
    async-api.yaml autorado (WI-149, gatilho browser-live) — sc-cv-03
    satisfeito.

    O enum de status reflete APENAS o lifecycle materializado do agg-payment
    (#PaymentState em contexts/fce/schemas/events.cue): estados T2 de roadmap
    (failed, indeterminate, cancelled) não são expostos como contrato.

    security e servers ausentes por design — ver
    architecture/deferred-decisions/def-024.

tags:
  - name: mesh
    description: bc=fce

paths:
  /v1/fce/queries/payment-settlement-status/{paymentId}:
    get:
      operationId: queryPaymentSettlementStatus
      summary: Consultar o estado de liquidação do Payment por PaymentId
      description: >
        Implementa a query-surface QueryPaymentSettlementStatus do canvas FCE.
        Leitura pura sem side-effects (read model do event log). paymentId em
        path para cache-friendly. Não emite outcome sob estado não-final.
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PaymentId'
      responses:
        '200':
          description: Estado de liquidação do Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSettlementStatusView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/fce/queries/escalated-payments:
    get:
      operationId: queryEscalatedPayments
      summary: Listar os Payments escalados aguardando decisão humana
      description: >
        Implementa a query-surface QueryEscalatedPayments do canvas FCE
        (WI-144): a fila de dúvidas da cadeia esperando decisão humana —
        Payments em estado escalated (adr-155) com o contexto FCE-local de
        triagem (valor, idade da escalação, condições que escalaram).
        Leitura pura sem side-effects (read model do event log). Envelope
        {items} desde o v1; paginação/filtros/metadados entram aditivamente
        como campos irmãos — NENHUM no v1. Fila vazia devolve items vazio
        (200), não 404.
      responses:
        '200':
          description: Fila de Payments escalados (possivelmente vazia)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalatedPaymentsView'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/fce/commands/resolve-guard-escalation:
    post:
      operationId: resolveGuardEscalation
      summary: Resolver um Payment escalado — override supervisionado (approve|deny)
      description: >
        Materializa cmd-resolve-guard-escalation (adr-155): um ato de
        julgamento humano, dois outcomes — approve transiciona
        escalated→authorized e emite PaymentGuardOverridden (com a proof para
        o audit trail); deny transiciona escalated→refused e emite
        PaymentGuardOverrideRefused. 200 devolve O EVENTO emitido (oneOf),
        molde CMT. Alcançável só de escalated (409 para qualquer outro
        estado); breach nunca escala (inv-breach-bypasses-escalation), logo
        nunca chega aqui. POSTURA (def-024): supervisorId é atribuição
        nominal NÃO-verificada nesta borda até o ADR de auth — a verificação
        de identidade é exatamente o que def-024 defere; security ausente por
        design.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveGuardEscalationRequest'
      responses:
        '200':
          description: Escalação resolvida — o evento emitido como confirmação
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PaymentGuardOverridden'
                  - $ref: '#/components/schemas/PaymentGuardOverrideRefused'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Chave única gerada pelo cliente (UUID v4 recomendado) usada pelo
        servidor para cachear resultado dentro de uma janela curta e detectar
        retry — request repetido com mesma key retorna mesmo resultado sem
        executar de novo. Padrão informal de mercado (RFC draft); janela
        exata definida quando ADR de stack chegar.
      schema:
        type: string
        minLength: 1

  responses:
    BadRequest:
      description: Request malformado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Recurso não encontrado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Transição de estado não permitida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Invariante de domínio violado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Erro interno
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: >
        RFC 7807 Problem Details. Cross-BC shared contract; NÃO customizar
        por BC. additionalProperties=true porque RFC 7807 §3.2 permite
        extensões por problem type — mas extensões só por coordenação
        cross-BC (tension-entry), nunca fork local.
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri
        traceId:
          type: string
          description: Correlation id para auditoria

    # ── Value-objects do FCE (mirror de schemas/events.cue) ──
    PaymentId:
      x-mesh-cue-ref: 'contexts/fce/schemas/events.cue#PaymentId'
      type: string
      minLength: 1
    CommitmentRef:
      x-mesh-cue-ref: 'contexts/fce/schemas/events.cue#CommitmentRef'
      type: string
      minLength: 1
      description: owned by CMT
    RailReferenceId:
      x-mesh-cue-ref: 'contexts/fce/schemas/events.cue#RailReferenceId'
      type: string
      minLength: 1
      description: referência do rail, devolvida pelo BKR na reconciliação
    PaymentState:
      x-mesh-cue-ref: 'contexts/fce/schemas/events.cue#PaymentState'
      type: string
      enum: [guarded, escalated, authorized, dispatched, settled, refused]
      description: >
        Estado canônico do Payment no lifecycle materializado do agg-payment
        (adr-155). Espelha #PaymentState (disjunção fechada). Estados T2 de
        roadmap (failed, indeterminate, cancelled) não são expostos.
    Money:
      x-mesh-cue-ref: 'contexts/fce/schemas/events.cue#Money'
      type: object
      description: >
        Espelho do #Money shared (def-025); mesma forma do mirror no
        contexts/cmt/api.yaml — cross-BC shared contract, não divergir.
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    OverriddenGuardConditions:
      x-mesh-cue-ref: 'contexts/fce/schemas/events.cue#OverriddenGuardConditions'
      type: object
      description: >
        O piso de EXATAMENTE 3 condições overridáveis (adr-155); a condição
        de integridade criptográfica é inoverridável e NÃO aparece aqui.
        additionalProperties false espelha a disjunção fechada do CUE.
      additionalProperties: false
      required: [invoiceStaleOverridden, eligibilityStaleOverridden, evidenceFreshnessOverridden]
      properties:
        invoiceStaleOverridden:
          type: boolean
        eligibilityStaleOverridden:
          type: boolean
        evidenceFreshnessOverridden:
          type: boolean
    SupervisorId:
      x-mesh-cue-ref: 'contexts/fce/schemas/events.cue#SupervisorId'
      type: string
      minLength: 1
      description: >
        Atribuição nominal do supervisor (adr-155: QUEM autorizou). Na borda,
        NÃO-verificada até ADR de auth (def-024).
    AuthorizationProof:
      x-mesh-cue-ref: 'contexts/fce/schemas/events.cue#AuthorizationProof'
      type: object
      required: [signature, nonce, validUntil, claimChain]
      properties:
        signature:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
        validUntil:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
        claimChain:
          type: string
          minLength: 1

    # ── Projection response (query-surface QueryPaymentSettlementStatus) ──
    PaymentSettlementStatusView:
      type: object
      description: >
        Read model da query QueryPaymentSettlementStatus (canvas FCE
        communication.inbound). View de nível de API — o FCE não declara
        projection no domain-model; os tipos de campo referenciam as value
        classes canônicas de contexts/fce/schemas/events.cue. settledAt e
        railReferenceId presentes apenas quando o Payment atingiu settled.
      required: [paymentId, commitmentRef, status]
      properties:
        paymentId:
          $ref: '#/components/schemas/PaymentId'
        commitmentRef:
          $ref: '#/components/schemas/CommitmentRef'
        status:
          $ref: '#/components/schemas/PaymentState'
        settledAt:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
        railReferenceId:
          $ref: '#/components/schemas/RailReferenceId'

    # ── Projection response (query-surface QueryEscalatedPayments, WI-144) ──
    EscalatedPaymentItem:
      type: object
      description: >
        Um Payment escalado aguardando decisão humana — alarme rico FCE-local:
        projeção do MESMO event log misturando estado do agg-payment (amount,
        escalatedAt, invoiceId, commitmentRef — campos do domain-model,
        adr-155) e o fato de escalação (escalatedConditions, de
        PaymentGuardEscalated). O dossiê profundo compõe-se no cliente via as
        queries do CMT (commitment-state) e do DLV (evidence-ledger,
        verification-status) seguindo o commitmentRef.
      required: [paymentId, commitmentRef, invoiceId, amount, escalatedAt, escalatedConditions]
      properties:
        paymentId:
          $ref: '#/components/schemas/PaymentId'
        commitmentRef:
          $ref: '#/components/schemas/CommitmentRef'
        invoiceId:
          type: string
          minLength: 1
          description: owned by INV
        amount:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
          description: >
            Decimal string pura (espelho do #DecimalString shared; Ion-4) — a
            forma que o evento produtor carrega (WI-145). Lacuna registrada:
            aggregate/evento sem currency declarado; correção futura =
            aggregate ganha #Money completo em fatia própria; gatilho =
            entrada de dado retido (mesmo do def-074). Quando corrigido, a
            View volta a Money.
        escalatedAt:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
        escalatedConditions:
          $ref: '#/components/schemas/OverriddenGuardConditions'
    EscalatedPaymentsView:
      type: object
      description: >
        Read model da query QueryEscalatedPayments (canvas FCE). Envelope de
        objeto desde o v1: paginação/filtros/metadados entram ADITIVAMENTE
        como campos irmãos de items em versões futuras — nenhum no v1.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EscalatedPaymentItem'

    # ── Command request (cmd-resolve-guard-escalation, WI-146) ──
    ResolveGuardEscalationRequest:
      x-mesh-cue-ref: 'contexts/fce/domain-model.cue#commands.cmd-resolve-guard-escalation'
      type: object
      required: [paymentId, supervisorId, reason, decision, overriddenConditions]
      properties:
        paymentId:
          $ref: '#/components/schemas/PaymentId'
        supervisorId:
          $ref: '#/components/schemas/SupervisorId'
        reason:
          type: string
          minLength: 1
        decision:
          type: string
          enum: [approve, deny]
          description: >
            Disjunção das 2 transições legais de escalated (domain-model);
            enum no mirror por fidelidade ao adr-155 — o campo do command é
            primitive string no domain-model.
        overriddenConditions:
          $ref: '#/components/schemas/OverriddenGuardConditions'

    # ── Event envelopes (200 do resolve; molde CMT: devolve o evento emitido) ──
    PaymentGuardOverridden:
      x-mesh-cue-ref: 'contexts/fce/schemas/events.cue#PaymentGuardOverridden'
      type: object
      required: [id, source, type, envelopeVersion, time, data]
      properties:
        id:
          type: string
          minLength: 1
        source:
          type: string
          const: mesh://contexts/fce
        type:
          type: string
          const: mesh.fce.payment-guard-overridden.v1
        envelopeVersion:
          type: string
          const: mesh-1
        time:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
        dataschema:
          type: string
          const: contexts/fce/schemas/events.cue#PaymentGuardOverridden
        data:
          type: object
          required: [paymentId, supervisorId, reason, overriddenConditions, proof]
          properties:
            paymentId:
              $ref: '#/components/schemas/PaymentId'
            supervisorId:
              $ref: '#/components/schemas/SupervisorId'
            reason:
              type: string
              minLength: 1
            overriddenConditions:
              $ref: '#/components/schemas/OverriddenGuardConditions'
            proof:
              $ref: '#/components/schemas/AuthorizationProof'
    PaymentGuardOverrideRefused:
      x-mesh-cue-ref: 'contexts/fce/schemas/events.cue#PaymentGuardOverrideRefused'
      type: object
      required: [id, source, type, envelopeVersion, time, data]
      properties:
        id:
          type: string
          minLength: 1
        source:
          type: string
          const: mesh://contexts/fce
        type:
          type: string
          const: mesh.fce.payment-guard-override-refused.v1
        envelopeVersion:
          type: string
          const: mesh-1
        time:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
        dataschema:
          type: string
          const: contexts/fce/schemas/events.cue#PaymentGuardOverrideRefused
        data:
          type: object
          required: [paymentId, supervisorId, reason]
          properties:
            paymentId:
              $ref: '#/components/schemas/PaymentId'
            supervisorId:
              $ref: '#/components/schemas/SupervisorId'
            reason:
              type: string
              minLength: 1
