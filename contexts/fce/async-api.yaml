asyncapi: '2.6.0'

info:
  title: Financial Commitment Execution async surface
  version: 0.1.0
  description: >
    Superfície assíncrona publicada pelo BC Financial Commitment Execution
    (FCE). Source canônica de identidade: contexts/fce/canvas.cue. Bindings
    e servers ausentes por design — ver
    architecture/deferred-decisions/def-023.


    Escopo: APENAS 2 dos 7 eventos próprios do contexts/fce/schemas/events.cue
    são publicados cross-BC: PaymentSettled (context-map fce-to-rew/
    fce-to-scf/fce-to-ato/fce-to-tcm) e PaymentObligationDefaulted
    (context-map fce-to-rew) — canvas outbound. Os 5 restantes são
    INTERNAL-ONLY por design — definidos em events.cue para replay/audit/
    coordenação interna, sem consumidor cross-BC em relationship do
    context-map, NÃO advertise como contrato público:

    - PaymentAuthorized — interno (guard aprovou as 3 condições; decisão
      econômica + proof emitida)
    - PaymentInstructionDispatched — interno (nenhuma relationship o
      consome; o contrato com BKR é command-invocation sync
      DispatchPaymentInstruction, não canal de evento)
    - PaymentGuardEscalated — interno (adr-155; a fila de escalados é
      exposta via QueryEscalatedPayments no api.yaml — esse é o contract
      público)
    - PaymentGuardOverridden, PaymentGuardOverrideRefused — internos
      (adr-155; outcomes devolvidos pelo POST resolve-guard-escalation
      no api.yaml)


    Timestamps de DOMÍNIO em RFC3339 (#RFC3339Timestamp shared — alinhado
    ao CMT, não ao integer do DLV; ver contexts/fce/schemas/events.cue
    header). Envelope.time mantém RFC3339 via shared-schemas/envelope.cue.

tags:
  - name: mesh
    description: bc=fce

channels:
  mesh.fce.payment-settled.v1:
    description: >
      Canal versionado para o evento PaymentSettled — fato canônico (SoT)
      de "dinheiro moveu" per canvas bd-settlement-fact-canonical.
      Consumidores descobertos via strategic/context-map.cue, relationships
      com source.context=fce (fce-to-rew, fce-to-scf, fce-to-ato,
      fce-to-tcm).
    publish:
      operationId: publishPaymentSettled
      message:
        $ref: '#/components/messages/PaymentSettled'

  mesh.fce.payment-obligation-defaulted.v1:
    description: >
      Canal versionado para o evento PaymentObligationDefaulted — sinal de
      comportamento financeiro adverso (default pós-tentativas / fora de
      janela honrável). Consumidores descobertos via
      strategic/context-map.cue, relationships com source.context=fce
      (fce-to-rew). NOTA: o FLUXO de default está fora da fatia atual (T2)
      — nenhuma transição do domain-model o emite ainda; canal declarado
      para integridade do contrato (espelho do catálogo events.cue +
      context-map, sc-cm-06). Canvas REW ainda não enumera o consumo
      (WI-043 / oq-fce-4 — forward reference).
    publish:
      operationId: publishPaymentObligationDefaulted
      message:
        $ref: '#/components/messages/PaymentObligationDefaulted'

components:
  messages:
    PaymentSettled:
      name: PaymentSettled
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PaymentSettled'

    PaymentObligationDefaulted:
      name: PaymentObligationDefaulted
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PaymentObligationDefaulted'

  schemas:
    PaymentSettled:
      x-mesh-cue-ref: 'contexts/fce/schemas/events.cue#PaymentSettled'
      type: object
      required: [id, source, type, envelopeVersion, time, data]
      properties:
        id:
          type: string
          minLength: 1
        source:
          type: string
          const: mesh://contexts/fce
        type:
          type: string
          const: mesh.fce.payment-settled.v1
        envelopeVersion:
          type: string
          const: mesh-1
        time:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
        dataschema:
          type: string
          const: contexts/fce/schemas/events.cue#PaymentSettled
        data:
          type: object
          required: [paymentId, commitmentRef, railReferenceId, settledAt]
          properties:
            paymentId:
              type: string
              minLength: 1
            commitmentRef:
              type: string
              minLength: 1
              description: owned by CMT
            railReferenceId:
              type: string
              minLength: 1
              description: >
                referência do rail devolvida pelo BKR na reconciliação
                (value-object local do FCE; origem BKR)
            settledAt:
              type: string
              format: date-time
              pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'

    PaymentObligationDefaulted:
      x-mesh-cue-ref: 'contexts/fce/schemas/events.cue#PaymentObligationDefaulted'
      type: object
      required: [id, source, type, envelopeVersion, time, data]
      properties:
        id:
          type: string
          minLength: 1
        source:
          type: string
          const: mesh://contexts/fce
        type:
          type: string
          const: mesh.fce.payment-obligation-defaulted.v1
        envelopeVersion:
          type: string
          const: mesh-1
        time:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
        dataschema:
          type: string
          const: contexts/fce/schemas/events.cue#PaymentObligationDefaulted
        data:
          type: object
          required: [paymentId, commitmentRef]
          properties:
            paymentId:
              type: string
              minLength: 1
            commitmentRef:
              type: string
              minLength: 1
              description: owned by CMT
